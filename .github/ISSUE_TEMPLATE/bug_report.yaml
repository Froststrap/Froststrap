name: Bug Report
title: "[BUG] "
description: Report a problem you're having
body:
  - type: checkboxes
    id: ack
    attributes:
      label: Acknowledgement
      description: If you tick any of these wrong, you may receive punishment in return
      options:
        - label: I have checked that this issue I am reporting doesn't exist in closed or open issues.
          required: false
        - label: I agree that I have just ticked all the boxes without actually reading
          required: false
        - label: I have given all relevant, detailed information with no placeholder text remaining
          required: false
        - label: I agree that false information ticked above could result in a temporary block in contributing
          required: true
  - type: input
    id: version
    attributes:
      label: Froststrap Version
      description: "What version of Froststrap are you using?"
      placeholder: "v1.2.3"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      description: "What OS are you using?"
      placeholder: "E.g. Windows 11 25H2, macOS Tahoe 26.6.2"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What problem did you encounter?
      description: Provide a comprehensive description of the problem you're facing. Don't forget to attach any additional resources you may have, such as log files and screenshots.
    validations:
      required: true
  - type: textarea
    id: repro-steps
    attributes:
      label: How do you reproduce the problem?
      description: Include the steps to reproduce the problem from start to finish. Include details such as FastFlags you added and settings you changed.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
  - type: textarea
    id: log
    attributes:
      label: Froststrap Log
      description: If you're getting a Froststrap Exception error, upload your log file here. Otherwise, just leave it empty.
      value: "N/A"
      render: text
