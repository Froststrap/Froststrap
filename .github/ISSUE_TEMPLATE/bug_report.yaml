name: Bug Report
title: "[BUG] "
description: Report a problem you're having
body:
  - type: input
    id: version
    attributes:
      label: Froststrap Version
      description: "What version of Froststrap are you using?"
      placeholder: "v2.0.0"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What problem did you encounter?
      description: Provide a comprehensive description of the problem you're facing. Don't forget to attach any additional resources you may have, such as log files and screenshots.
    validations:
      required: true
  - type: textarea
    id: repro-steps
    attributes:
      label: How do you reproduce the problem?
      description: Include the steps to reproduce the problem from start to finish. Include details such as FastFlags you added and settings you changed.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
  - type: textarea
    id: log
    attributes:
      label: Froststrap Log
      description: |
        If you're getting an exception, please copy the log content and paste it here.
        You can find the log file at:
          - Windows: `%localappdata%\Froststrap\Logs\Froststrap_*.log` (the most recent file is the latest)
          - macOS: `~/Library/Application Support/Froststrap/Logs/Froststrap_*.log`
          - Linux: `~/.local/share/Froststrap/Logs/Froststrap_*.log`
        **Alternatively**, click the **“Copy Log to Clipboard”** button inside the exception window and paste it below.
      value: "N/A"
      render: text