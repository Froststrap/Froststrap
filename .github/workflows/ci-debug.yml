name: Build (Debug)
on: [push, pull_request]
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Install Nushell
        shell: pwsh
        run: |
          winget install --id Nushell.Nushell --exact --accept-source-agreements --accept-package-agreements
          $nuDir = Split-Path (Get-Command nu.exe -ErrorAction SilentlyContinue).Path
          if (-not $nuDir) {
            $nuDir = "$env:LOCALAPPDATA\Microsoft\WinGet\Links"
          }
          echo $nuDir >> $env:GITHUB_PATH
      - name: Set short SHA
        run: echo "SHORT_SHA=$("${{ github.sha }}".Substring(0, 7))" >> $env:GITHUB_ENV
      - name: Publish
        run: nu ./Scripts/main.nu debug
      - uses: actions/upload-artifact@v6
        with:
          name: froststrap-debug-win-x64-${{ env.SHORT_SHA }}
          path: Froststrap/bin/Debug/net10.0/win-x64/publish/*

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
      - uses: DeterminateSystems/nix-installer-action@v14
      - name: Publish
        run: nix develop -c nu ./Scripts/main.nu debug
      - uses: actions/upload-artifact@v6
        with:
          name: froststrap-debug-macos-arm64-${{ env.SHORT_SHA }}
          path: Froststrap/bin/Debug/net10.0/osx-arm64/publish/*

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
      - uses: DeterminateSystems/nix-installer-action@v14
      - name: Publish
        run: nix develop -c nu ./Scripts/main.nu debug
      - uses: actions/upload-artifact@v6
        with:
          name: froststrap-debug-linux-x64-${{ env.SHORT_SHA }}
          path: Froststrap/bin/Debug/net10.0/linux-x64/publish/*
