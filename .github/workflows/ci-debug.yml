name: Build (Debug)
on: [push, pull_request]
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Install Nushell
        shell: pwsh
        run: |
          winget install --id Nushell.Nushell --exact --accept-source-agreements --accept-package-agreements
          $nuDir = Split-Path (Get-Command nu.exe -ErrorAction SilentlyContinue).Path
          if (-not $nuDir) {
            $nuDir = "$env:LOCALAPPDATA\Microsoft\WinGet\Links"
          }
          echo $nuDir >> $env:GITHUB_PATH
      - name: Set short SHA
        run: echo "SHORT_SHA=$("${{ github.sha }}".Substring(0, 7))" >> $env:GITHUB_ENV
      - name: Publish
        run: nu ./main.nu debug
      - uses: actions/upload-artifact@v6
        with:
          name: froststrap-debug-win-x64-${{ env.SHORT_SHA }}
          path: Froststrap/bin/Debug/net10.0/win-x64/publish/*

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Install Nushell
        run: brew install nushell
      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
      - name: Publish
        run: nu ./main.nu debug
      - uses: actions/upload-artifact@v6
        with:
          name: froststrap-debug-macos-arm64-${{ env.SHORT_SHA }}
          path: Froststrap/bin/Debug/net10.0/osx-arm64/publish/*

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Install Nushell
        shell: bash
        run: |
          wget -qO- https://apt.fury.io/nushell/gpg.key |
            sudo gpg --dearmor -o /etc/apt/keyrings/fury-nushell.gpg

          echo "deb [signed-by=/etc/apt/keyrings/fury-nushell.gpg] https://apt.fury.io/nushell/ /" |
            sudo tee /etc/apt/sources.list.d/fury-nushell.list

          sudo apt-get update
          sudo apt-get install -y nushell
      - name: Publish
        run: nu ./main.nu debug
      - uses: actions/upload-artifact@v6
        with:
          name: froststrap-debug-linux-x64-${{ env.SHORT_SHA }}
          path: Froststrap/bin/Debug/net10.0/linux-x64/publish/*
