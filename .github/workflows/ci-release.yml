name: Build (Release)

on:
  push:
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install NSIS
        uses: negrutiu/nsis-install@v2
          
      - name: Build and package
        run: dotnet run --project build -- Publish --configuration Release

      - uses: actions/upload-artifact@v7
        with:
          name: froststrap-release-win-x64-${{ github.sha }}
          path: .build/dist/*

  build-macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x64

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Remove stale signing keychain
        if: startsWith(github.ref, 'refs/tags/v')
        run: security delete-keychain signing_temp.keychain || true

      - name: Import app cert
        id: import_app_cert
        if: startsWith(github.ref, 'refs/tags/v')
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.CERT_P12_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Import installer cert
        if: startsWith(github.ref, 'refs/tags/v')
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.CERT_P12_INSTALLER_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}
          create-keychain: false
          keychain-password: ${{ steps.import_app_cert.outputs.keychain-password }}

      - name: Build, sign (if release), and package
        env:
          SIGN: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
          DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APP }}
          DEVELOPER_ID_INSTALLER: ${{ secrets.DEVELOPER_ID_INSTALLER }}
          APP_STORE_CONNECT_P8_CONTENT: ${{ secrets.APP_STORE_CONNECT_P8_CONTENT }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
        run: dotnet run --project build -- Publish --configuration Release

      - name: Rename package for architecture
        run: mv .build/dist/Froststrap.pkg .build/dist/Froststrap-macos-${{ matrix.arch }}.pkg

      - uses: actions/upload-artifact@v7
        with:
          name: froststrap-release-macos-${{ matrix.arch }}-${{ github.sha }}
          path: .build/dist/Froststrap-macos-${{ matrix.arch }}.pkg

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build and package binaries
        run: dotnet run --project build -- Publish --configuration Release

      - uses: actions/upload-artifact@v7
        with:
          name: froststrap-release-linux-x64-${{ github.sha }}
          path: .build/dist/*

  release:
    needs:
      - build-windows
      - build-linux
      - build-macos

    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: froststrap-release-win-x64-${{ github.sha }}
          path: release

      - name: Download macOS ARM64 artifact
        uses: actions/download-artifact@v7
        with:
          name: froststrap-release-macos-arm64-${{ github.sha }}
          path: release

      - name: Download macOS x64 artifact
        uses: actions/download-artifact@v7
        with:
          name: froststrap-release-macos-x64-${{ github.sha }}
          path: release

      - name: Download Linux artifact
        uses: actions/download-artifact@v7
        with:
          name: froststrap-release-linux-x64-${{ github.sha }}
          path: release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Froststrap ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            release/Froststrap-windows-x64.exe
            release/Froststrap-macos-arm64.pkg
            release/Froststrap-macos-x64.pkg
            release/Froststrap-linux-x64.AppImage
            release/Froststrap-linux-x64.deb
            release/Froststrap-linux-x64.rpm
