name: Build & Package

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-tags : true
          fetch-depth: 1

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: '**/**/**/packages.lock.json'

      - name: Install NSIS
        uses: negrutiu/nsis-install@v2
          
      - name: Publish
        run: dotnet run --project build -- Publish

      - uses: actions/upload-artifact@v7
        with:
          name: froststrap-release-win-x64-${{ github.sha }}
          path: .build/dist/*

  build-macos:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            rust-target: aarch64-apple-darwin
          - arch: x64
            rust-target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-tags : true
          fetch-depth: 1

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: '**/**/**/packages.lock.json'

      - name: Add Rust target
        run: rustup target add ${{ matrix.rust-target }}

      - name: Remove stale signing keychain
        if: startsWith(github.ref, 'refs/tags/v')
        run: security delete-keychain signing_temp.keychain || true

      - name: Import app cert
        id: import_app_cert
        if: startsWith(github.ref, 'refs/tags/v')
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.CERT_P12_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Import installer cert
        if: startsWith(github.ref, 'refs/tags/v')
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.CERT_P12_INSTALLER_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}
          create-keychain: false
          keychain-password: ${{ steps.import_app_cert.outputs.keychain-password }}

      - name: Publish
        env:
          SIGN: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
          DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APP }}
          DEVELOPER_ID_INSTALLER: ${{ secrets.DEVELOPER_ID_INSTALLER }}
          APP_STORE_CONNECT_P8_CONTENT: ${{ secrets.APP_STORE_CONNECT_P8_CONTENT }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
        run: dotnet run --project build -- Publish --override-arch ${{ matrix.arch }}

      - name: Rename package for architecture
        run: mv .build/dist/Froststrap.pkg .build/dist/Froststrap-macos-${{ matrix.arch }}.pkg

      - uses: actions/upload-artifact@v7
        with:
          name: froststrap-release-macos-${{ matrix.arch }}-${{ github.sha }}
          path: .build/dist/Froststrap-macos-${{ matrix.arch }}.pkg

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-tags : true
          fetch-depth: 1

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: '**/**/**/packages.lock.json'

      - name: Publish
        run: dotnet run --project build -- Publish

      - uses: actions/upload-artifact@v7
        with:
          name: froststrap-release-linux-x64-${{ github.sha }}
          path: .build/dist/*
