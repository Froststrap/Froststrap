name: Build & Package

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

env:
  VPK_VERSION: "1.2.161"
  PACKAGES_REPO: https://github.com/Froststrap/packages

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with: { submodules: true, fetch-tags: true, fetch-depth: 1 }

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Use nightly Rust
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly
          dotnet tool install -g vpk --version $VPK_VERSION

      - name: Fetch previous release (for deltas)
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: |
          PRE=""; [[ "$GITHUB_REF_NAME" == *-* ]] && PRE="--pre"
          vpk download github --repoUrl $PACKAGES_REPO --token ${{ secrets.PACKAGE_TOKEN }} --channel windows-x64 --outputDir .build/velopack $PRE

      - name: Publish
        run: cargo xtask publish

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xtask-timings-windows-${{ github.sha }}
          path: build/target/cargo-timings/*.html
          if-no-files-found: warn

      - name: Upload to packages release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PRE=""; [[ "$GITHUB_REF_NAME" == *-* ]] && PRE="--pre"
          vpk upload github --repoUrl $PACKAGES_REPO --token ${{ secrets.PACKAGE_TOKEN }} --channel windows-x64 --outputDir .build/velopack --tag "$GITHUB_REF_NAME" --releaseName "$GITHUB_REF_NAME" --merge $PRE

      - uses: actions/upload-artifact@v7
        with:
          name: froststrap-release-win-x64-${{ github.sha }}
          path: .build/velopack/*

  macos:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, rust-target: aarch64-apple-darwin }
          - { arch: x64, rust-target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v7
        with: { submodules: true, fetch-tags: true, fetch-depth: 1 }

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install other deps
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly
          rustup target add ${{ matrix.rust-target }}
          dotnet tool install -g vpk --version $VPK_VERSION

      - name: Remove stale signing keychain
        if: startsWith(github.ref, 'refs/tags/v')
        run: security delete-keychain signing_temp.keychain || true

      - name: Import signing certs
        if: startsWith(github.ref, 'refs/tags/v')
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.CERT_P12_BASE64 }}
          p12-password: ${{ secrets.CERT_P12_PASS }}

      - name: Resolve signing identities
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          KC=~/Library/Keychains/signing_temp.keychain-db
          APP=$(security find-identity -v "$KC" | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          INST=$(security find-identity -v "$KC" | grep "Developer ID Installer" | head -1 | awk -F'"' '{print $2}')
          echo "::add-mask::$APP"
          echo "::add-mask::$INST"
          echo "DEVELOPER_ID_APP=$APP" >> "$GITHUB_ENV"
          echo "DEVELOPER_ID_INSTALLER=$INST" >> "$GITHUB_ENV"

      - name: Store notary profile
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          P8: ${{ secrets.APP_STORE_CONNECT_P8_CONTENT }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
        run: |
          printf '%s' "$P8" > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials froststrap-notary --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_KEY_ID" --issuer "$APPLE_ISSUER_ID" --keychain ~/Library/Keychains/signing_temp.keychain-db
          rm "$RUNNER_TEMP/AuthKey.p8"

      - name: Fetch previous release (for deltas)
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: |
          PRE=""; [[ "$GITHUB_REF_NAME" == *-* ]] && PRE="--pre"
          vpk download github --repoUrl $PACKAGES_REPO --token ${{ secrets.PACKAGE_TOKEN }} --channel macos-${{ matrix.arch }} --outputDir .build/velopack $PRE

      - name: Publish
        env:
          SIGN: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
        run: cargo xtask --override-arch ${{ matrix.arch }} publish
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xtask-timings-macos-${{ github.sha }}
          path: build/target/cargo-timings/*.html
          if-no-files-found: warn
      - name: Upload to packages release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PRE=""; [[ "$GITHUB_REF_NAME" == *-* ]] && PRE="--pre"
          vpk upload github --repoUrl $PACKAGES_REPO --token ${{ secrets.PACKAGE_TOKEN }} --channel macos-${{ matrix.arch }} --outputDir .build/velopack --tag "$GITHUB_REF_NAME" --releaseName "$GITHUB_REF_NAME" --merge $PRE

      - uses: actions/upload-artifact@v7
        with:
          name: froststrap-release-macos-${{ matrix.arch }}-${{ github.sha }}
          path: .build/velopack/*

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { submodules: true, fetch-tags: true, fetch-depth: 1 }

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install other deps
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly
          dotnet tool install -g vpk --version $VPK_VERSION
          sudo apt install -y libdbus-1-dev pkg-config

      - name: Fetch previous release (for deltas)
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: |
          PRE=""; [[ "$GITHUB_REF_NAME" == *-* ]] && PRE="--pre"
          vpk download github --repoUrl $PACKAGES_REPO --token ${{ secrets.PACKAGE_TOKEN }} --channel linux-x64 --outputDir .build/velopack $PRE

      - name: Publish
        run: cargo xtask publish

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xtask-timings-linux-${{ github.sha }}
          path: build/target/cargo-timings/*.html
          if-no-files-found: warn

      - name: Upload to packages release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PRE=""; [[ "$GITHUB_REF_NAME" == *-* ]] && PRE="--pre"
          vpk upload github --repoUrl $PACKAGES_REPO --token ${{ secrets.PACKAGE_TOKEN }} --channel linux-x64 --outputDir .build/velopack --tag "$GITHUB_REF_NAME" --releaseName "$GITHUB_REF_NAME" --merge $PRE

      - uses: actions/upload-artifact@v7
        with:
          name: froststrap-release-linux-x64-${{ github.sha }}
          path: |
            .build/velopack/*
            .build/dist/*.deb
            .build/dist/*.rpm
            .build/dist/*.tar.zst
