name: Prepare Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches csproj version
        run: |
          version="$(sed -n 's:.*<AppVersion[^>]*>\([^<]*\)</AppVersion>.*:\1:p' Froststrap/Froststrap.csproj | head -n1)"
          if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match AppVersion $version in Froststrap/Froststrap.csproj"
            exit 1
          fi

      - name: Init release in packages repo
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
        run: |
          PRE=""; [[ "$GITHUB_REF_NAME" == *-* ]] && PRE="--prerelease"
          gh release view "$GITHUB_REF_NAME" --repo Froststrap/packages >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo Froststrap/packages --draft --title "$GITHUB_REF_NAME" --notes "" $PRE

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      configuration: release
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: froststrap-release-*-${{ github.sha }}
          merge-multiple: true
          path: release

      - uses: softprops/action-gh-release@v3
        with:
          name: Froststrap ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            release/**/*.msi
            release/**/*.pkg
            release/**/*.AppImage
            release/**/*.deb
            release/**/*.rpm
            release/**/*.tar.zst
