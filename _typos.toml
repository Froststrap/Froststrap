[files]
extend-exclude = ["Froststrap.Localisation/Resources/Translations/*.json", "nix/deps.json"]

[type.control-strings]
extend-glob = ["*ControlStrings.json"]
check-file = false

[default]
extend-ignore-identifiers-re = [
  "fram",
  "Sur", # macOS Big Sur
  "selecton", # down-styled of SelectOn
  "[A-Za-z0-9+/]{40,}={0,2}", # honstly no idea just got from an AI- should AFAIK just be allowing words over 40 char
  "Astroid", # lucide spells it this way? 
]
